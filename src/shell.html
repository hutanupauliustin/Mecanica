<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulator Mecanica</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        #canvas { 
            border: 2px solid #444444;
            border-radius: 6px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" width="1280" height="720"></canvas>
    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            setStatus: function(text) {},
            onRuntimeInitialized: function() {}
        };

        function rezizeCanvas() {
            var canvas = document.getElementById('canvas');
            var maxW = window.innerWidth * 0.9;
            var maxH = window.innerHeight * 0.9;
            
            var w = maxW;
            var h = w * 3 / 4;
            
            if (h > maxH) {
                h = maxH;
                w = h * 4 / 3;
            }
            
            canvas.style.width  = w + 'px';
            canvas.style.height = h + 'px';
        }

        window.addEventListener('resize', rezizeCanvas);
        rezizeCanvas(); // rulam direct, canvas-ul exista deja
    </script>
    {{{ SCRIPT }}}
</body>
</html>
